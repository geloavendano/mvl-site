<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>MVL Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">
<header class="admin-topbar"><a href="index.html"><img src="assets/hero-mvl-2026-logo.png" alt="MVL 2026"></a><button id="signOutBtn" class="admin-link is-hidden">Sign out</button></header>
<main class="admin-main">
  <section id="loginPanel" class="admin-panel admin-login"><p class="games-label">Restricted access</p><h1>MVL Admin</h1>
    <div class="admin-form"><p class="admin-login-copy">Continue with an allowlisted Google account.</p><button id="googleSignInBtn" class="cta cta--primary" type="button">Continue with Google</button><p id="loginStatus" class="form-status"></p></div>
  </section>
  <section id="dashboard" class="is-hidden">
    <div class="admin-heading"><div><h1>MVL Admin</h1><p>Manage the livestream, schedule, matchups, and results.</p></div><p id="adminIdentity"></p></div>
    <form id="livestreamForm" class="admin-panel admin-form"><div class="admin-panel-head"><div><h2>Livestream</h2><p>Controls the livestream state on the homepage.</p></div><label class="admin-switch"><input name="isLive" type="checkbox"> Live now</label></div><label class="field"><span>YouTube livestream link</span><input name="youtubeUrl" type="url" placeholder="https://youtube.com/watch?v=..."></label><div class="admin-form-actions"><button class="cta cta--primary">Save livestream</button><p class="form-status"></p></div></form>
    <div class="admin-games-toolbar"><div><h2>Games</h2><p id="adminDaySummary"></p></div><label class="admin-day-filter"><span>Match day</span><select id="adminDayFilter"></select></label></div>
    <div id="adminGameList"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/league-data.js"></script><script src="js/admin.js"></script>
</body></html>
