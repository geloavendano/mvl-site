<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>MVL Court Scoreboard</title>
  <link rel="icon" type="image/svg+xml" href="/mvl/assets/metarice-icon.svg">
  <link rel="stylesheet" href="/mvl/css/scoreboard-court.css?v=sponsor-frame-align">
</head>
<body>
  <main class="court-stage" aria-live="polite">
    <section id="courtScoreboard" class="court-scoreboard is-loading" aria-label="Current match score">
      <article id="leftTeamPanel" class="court-team-panel">
        <div class="court-team-heading"><span id="leftService" class="court-service">Serving</span><h2 id="leftName">Team A</h2></div>
        <strong id="leftScore" class="court-score">0</strong>
        <div class="court-sets"><span>Sets won</span><b id="leftSets">0</b></div>
      </article>
      <article id="rightTeamPanel" class="court-team-panel">
        <div class="court-team-heading"><span id="rightService" class="court-service">Serving</span><h2 id="rightName">Team B</h2></div>
        <strong id="rightScore" class="court-score">0</strong>
        <div class="court-sets"><span>Sets won</span><b id="rightSets">0</b></div>
      </article>
    </section>

    <section class="court-set-history" aria-labelledby="setScoresTitle">
      <h2 id="setScoresTitle">Set points</h2>
      <div id="setScores" class="court-set-scores"><p>Set scores will appear here.</p></div>
    </section>

    <footer class="court-sponsor-dock">
      <div class="court-brand-frame">
        <img class="court-brand-star" src="/mvl/assets/main-star.png" alt="">
        <img class="court-brand-logo" src="/mvl/assets/hero-mvl-2026-logo.png" alt="Metarice Volleyball League 2026">
      </div>
      <section class="court-sponsors marquee" aria-label="MVL sponsors">
        <div class="marquee-track" data-marquee="all"></div>
      </section>
    </footer>
    <p id="courtStatus" class="court-status">Connecting to scoreboard…</p>
  </main>
  <script src="/mvl/js/supabase-config.js?v=fg-cluster"></script>
  <script src="/mvl/js/league-data.js?v=photos-4"></script>
  <script src="/mvl/js/scoreboard-court.js?v=short-court-links"></script>
  <script src="/mvl/js/marquee.js?v=full-roster"></script>
</body>
</html>
